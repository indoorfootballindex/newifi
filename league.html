<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League — Indoor Football Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  :root{
    --arena-black:#111316;
    --arena-black-2:#1a1d21;
    --crimson:#D4263A;
    --amber:#E8A33D;
    --turf:#3C6E47;
    --chalk:#F2EFE6;
    --chalk-dim:#c9c6bc;
    --steel:#82868c;
    --steel-line:#2a2d31;
    --card:#1c1f23;
    --card-line:#2e3136;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--arena-black); color:var(--chalk);
    font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Anton',sans-serif; text-transform:uppercase; letter-spacing:0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit; text-decoration:none;}

  .hashes{width:100%; height:14px; display:flex; align-items:center;}
  .hashes svg{width:100%; height:100%; display:block;}

  .topbar{
    width:100%; background:var(--card); border-bottom:1px solid var(--card-line);
    position:sticky; top:0; z-index:100;
  }
  .topbar-inner{display:flex; align-items:center; justify-content:space-between; max-width:1400px; margin:0 auto; padding:16px 32px; gap:20px;}
  .topbar .site{font-size:13px; letter-spacing:0.14em; text-transform:uppercase; color:var(--steel); white-space:nowrap;}
  .topbar .site strong{color:var(--chalk); font-weight:600;}
  .nav-desktop{display:flex; gap:22px; font-size:12px; letter-spacing:0.05em; text-transform:uppercase; color:var(--steel); flex-wrap:wrap;}
  .nav-desktop a:hover{color:var(--chalk);}
    .topbar .site .crumb{color:var(--steel);}
  .hamburger-btn{display:none; background:none; border:none; color:var(--chalk); font-size:20px; line-height:1; cursor:pointer; padding:2px 4px; flex-shrink:0;}
  .mobile-menu{display:none; flex-direction:column; background:var(--card); border-bottom:1px solid var(--card-line); padding:6px 24px 14px;}
  .mobile-menu.open{display:flex;}
  .mobile-menu a{padding:11px 0; font-size:13px; color:var(--chalk-dim); border-bottom:1px solid var(--steel-line); text-transform:uppercase; letter-spacing:0.05em;}
  .mobile-menu a:last-child{border-bottom:none;}
  @media (max-width:860px){
    .nav-desktop{display:none;}
      .hamburger-btn{display:block;}
    .topbar-inner{padding:14px 16px; gap:10px; flex-wrap:wrap;}
    .topbar .site{font-size:11px;}
    .topbar .site .crumb{display:none;}
  }

  main{max-width:1100px; margin:0 auto; padding:0 24px 60px;}

  .hero{display:grid; grid-template-columns:auto 1fr; gap:28px; align-items:center; padding:52px 0 36px;}
  .hero-logo{width:110px; height:110px; border-radius:16px; border:1px solid var(--card-line); background:var(--card); display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0;}
  .hero-logo img{width:100%; height:100%; object-fit:contain; padding:12px;}
  .hero-id .eyebrow{font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:var(--crimson); font-weight:600; margin:0 0 10px;}
  .hero-id h1{font-size:clamp(32px,5.5vw,52px); line-height:0.98; margin:0 0 14px; color:var(--chalk);}
  .hero-id .sub{display:flex; flex-wrap:wrap; gap:6px 18px; font-size:14px; color:var(--steel);}
  .hero-id .sub b{color:var(--chalk-dim); font-weight:500;}
  .active-badge{display:inline-block; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; font-weight:700; padding:3px 10px; border-radius:5px;}
  .active-badge.active{background:rgba(60,110,71,0.2); color:#7fc492;}
  .active-badge.inactive{background:rgba(130,134,140,0.15); color:var(--steel);}
  @media (max-width:640px){.hero{grid-template-columns:1fr; text-align:center;} .hero-logo{margin:0 auto;}}

  section{padding:36px 0;}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px; gap:16px; flex-wrap:wrap;}
  .section-head h2{font-size:24px; margin:0; color:var(--chalk);}

  .history-copy p{font-size:15px; line-height:1.75; color:var(--chalk-dim); margin:0;}

  select.unit-select{
    appearance:none; -webkit-appearance:none; background:var(--card); color:var(--chalk);
    border:1px solid var(--card-line); border-radius:8px; padding:9px 34px 9px 14px;
    font-family:'IBM Plex Mono',monospace; font-size:13px; cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0L5 6L10 0Z' fill='%2382868c'/></svg>");
    background-repeat:no-repeat; background-position:right 14px center;
  }

  .season-panel{border:1px solid var(--card-line); border-radius:10px; background:var(--card); padding:26px 28px;}
  .season-panel .yr-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
  .season-panel .yr-big{font-size:36px; color:var(--chalk);}
  .season-panel .games{font-size:12px; color:var(--steel);}
  .season-panel .champ{
    background:var(--arena-black-2); border:1px solid var(--card-line); border-radius:8px;
    padding:14px 16px; margin-bottom:18px;
  }
  .season-panel .champ .label{font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--amber); margin-bottom:5px;}
  .season-panel .champ .value{font-size:15px; color:var(--chalk); font-weight:600;}
  .season-panel .about{font-size:14px; color:var(--chalk-dim); line-height:1.6; margin-bottom:18px;}

  .award-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  @media (max-width:640px){.award-grid{grid-template-columns:1fr;}}
  .award-item{background:var(--arena-black-2); border:1px solid var(--card-line); border-radius:8px; padding:12px 14px;}
  .award-item .label{font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--steel); margin-bottom:4px;}
  .award-item .value{font-size:13px; color:var(--chalk); line-height:1.4;}

  .empty-state{padding:60px 24px; text-align:center; color:var(--steel);}
  .empty-state h1{color:var(--chalk); font-size:28px; margin-bottom:10px;}
  .no-data{padding:24px; text-align:center; font-size:13px; color:var(--steel); border:1px dashed var(--card-line); border-radius:10px;}

  .standings-wrap{border:1px solid var(--card-line); border-radius:10px; overflow:hidden;}
  .standings-wrap table{width:100%; border-collapse:collapse;}
  .standings-wrap thead th{
    background:var(--arena-black-2); color:var(--chalk); text-align:left; font-size:11px; letter-spacing:0.08em;
    text-transform:uppercase; padding:12px 16px; font-weight:700; font-style:italic;
  }
  .standings-wrap thead th.num{text-align:right;}
  .standings-wrap .conf-row td{
    background:var(--card); color:var(--amber); font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
    font-weight:700; padding:8px 16px; font-style:italic;
  }
  .standings-wrap tbody tr.team-row{border-bottom:1px solid var(--steel-line);}
  .standings-wrap tbody tr.team-row:hover td{background:rgba(255,255,255,0.02);}
  .standings-wrap tbody tr.team-row:last-child{border-bottom:none;}
  .standings-wrap td{padding:12px 16px; font-size:13px;}
  .standings-wrap td.num{text-align:right; font-family:'IBM Plex Mono',monospace; color:var(--chalk-dim);}
  .standings-wrap td.record{text-align:right; font-family:'IBM Plex Mono',monospace; color:var(--chalk); font-weight:600;}
  .standings-team{display:flex; align-items:center; gap:10px;}
  .standings-team .logo{width:28px; height:28px; border-radius:6px; background:var(--arena-black-2); flex-shrink:0; display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .standings-team .logo img{width:100%; height:100%; object-fit:contain; padding:3px;}
  .standings-team a{font-weight:600; color:var(--chalk); text-decoration:underline; text-decoration-color:var(--card-line);}
  .standings-team a:hover{color:var(--amber); text-decoration-color:var(--amber);}

  footer{max-width:1100px; margin:0 auto; padding:40px 24px 60px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; font-size:12px; color:var(--steel);}

  ::selection{background:var(--crimson); color:var(--chalk);}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="site"><a href="index.html"><strong>Indoor Football Index</strong></a><span class="crumb"> / Leagues</span></div>
    <nav class="nav-desktop">
      <a href="leagues.html">Leagues</a>
      <a href="teams.html">Teams</a>
      <a href="standings.html">Standings</a>
      <a href="players.html">Players</a>
      <a href="stats.html">Stats</a>
      <a href="awards.html">Awards</a>
      <a href="coaches.html">Coaches</a>
      <a href="schedule.html">Schedule</a>
      <a href="scorigami.html">Scorigami</a>
      <a href="news.html">News</a>
    </nav>
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">&#9776;</button>
  </div>
  <div class="mobile-menu" id="mobileMenu">
    <a href="leagues.html">Leagues</a>
    <a href="teams.html">Teams</a>
    <a href="standings.html">Standings</a>
    <a href="players.html">Players</a>
      <a href="stats.html">Stats</a>
    <a href="awards.html">Awards</a>
    <a href="coaches.html">Coaches</a>
    <a href="schedule.html">Schedule</a>
    <a href="scorigami.html">Scorigami</a>
    <a href="news.html">News</a>
  </div>
</div>

<script>
  (function(){
    var btn = document.getElementById('hamburgerBtn');
    var menu = document.getElementById('mobileMenu');
    if (btn && menu){
      btn.addEventListener('click', function(){ menu.classList.toggle('open'); });
    }
  })();
</script>



<main id="main">
  <div class="empty-state" id="loading">Loading league&hellip;</div>
</main>

<footer>
  <span>Indoor Football Index &middot; League data compiled from league records.</span>
  <span id="footer-name"></span>
</footer>

<script>
  function esc(s){
    var d = document.createElement('div');
    d.textContent = s == null ? '' : s;
    return d.innerHTML;
  }

  function hashes(){
    return '<div class="hashes"><svg preserveAspectRatio="none" viewBox="0 0 1100 14"><line x1="0" y1="7" x2="1100" y2="7" stroke="#2a2d31" stroke-width="1"/></svg></div>';
  }

  function parseRecord(rec){
    if (!rec) return {w:0, l:0, t:0};
    var parts = String(rec).split('-').map(Number);
    return {w: parts[0]||0, l: parts[1]||0, t: parts[2]||0};
  }

  function buildStandingsSection(lg, teams){
    var yearSet = {};
    teams.forEach(function(t){
      if (!t.seasons) return;
      Object.keys(t.seasons).forEach(function(y){
        var s = t.seasons[y];
        if (s.league === lg.acronym && s.games && s.games.length){
          yearSet[y] = true;
        }
      });
    });
    var years = Object.keys(yearSet).sort(function(a,b){ return b-a; });
    if (!years.length) return '';

    var options = years.map(function(y,i){ return '<option value="' + y + '"' + (i===0?' selected':'') + '>' + y + '</option>'; }).join('');
    return '<section id="standings"><div class="section-head"><h2 class="display">Standings</h2></div>' +
      '<div style="margin-bottom:20px;"><select class="unit-select" id="standings-year">' + options + '</select></div>' +
      '<div id="standings-panel"></div></section>' + hashes();
  }

  function renderStandingsYear(lg, teams, year){
    var rows = [];
    teams.forEach(function(t){
      var s = t.seasons && t.seasons[year];
      if (!s || s.league !== lg.acronym || !s.games || !s.games.length) return;
      var rec = parseRecord(s.reg);
      rows.push({
        name: s.name || t.name, slug: t.slug,
        logo: s.logo || (t.logos && t.logos[0] && t.logos[0].url) || null,
        conference: s.conference || 'League',
        record: s.reg || '0-0',
        w: rec.w, l: rec.l,
      });
    });

    var panel = document.getElementById('standings-panel');
    if (!rows.length){
      panel.innerHTML = '<div class="no-data">No standings on file for ' + year + '.</div>';
      return;
    }

    var byConf = {}, confOrder = [];
    rows.forEach(function(r){
      if (!byConf[r.conference]){ byConf[r.conference] = []; confOrder.push(r.conference); }
      byConf[r.conference].push(r);
    });
    confOrder.sort();

    var html = '<div class="standings-wrap"><table><thead><tr><th>Team</th><th class="num">Record</th><th class="num">W</th><th class="num">L</th></tr></thead><tbody>';
    confOrder.forEach(function(conf){
      var teamRows = byConf[conf].slice().sort(function(a,b){ return b.w - a.w || a.l - b.l; });
      html += '<tr class="conf-row"><td colspan="4">' + esc(conf) + '</td></tr>';
      teamRows.forEach(function(r){
        var logoHtml = r.logo ? '<img src="' + esc(r.logo) + '" alt="' + esc(r.name) + ' logo" onerror="this.parentElement.style.display=\'none\'">' : '';
        html += '<tr class="team-row">' +
          '<td><div class="standings-team"><div class="logo">' + logoHtml + '</div><a href="team.html?team=' + esc(r.slug) + '">' + esc(r.name) + '</a></div></td>' +
          '<td class="record">' + esc(r.record) + '</td><td class="num">' + r.w + '</td><td class="num">' + r.l + '</td>' +
        '</tr>';
      });
    });
    html += '</tbody></table></div>';
    panel.innerHTML = html;
  }

  function render(lg, teams){
    var main = document.getElementById('main');
    document.getElementById('footer-name').textContent = lg.name;
    document.title = lg.name + ' \u2014 Indoor Football Index';

    var logoHtml = lg.logo ? '<img src="' + esc(lg.logo) + '" alt="' + esc(lg.name) + ' logo">' : '';
    var badge = '<span class="active-badge ' + (lg.active?'active':'inactive') + '">' + (lg.active?'Active':'Inactive') + '</span>';

    var historyHtml = lg.history
      ? '<section><div class="section-head"><h2 class="display">History</h2></div><div class="history-copy"><p>' + esc(lg.history) + '</p></div></section>' + hashes()
      : '';

    var standingsHtml = buildStandingsSection(lg, teams);

    var years = Object.keys(lg.seasons || {}).sort(function(a,b){ return b-a; });
    var seasonSectionHtml = '';
    if (years.length){
      var options = years.map(function(y,i){ return '<option value="' + y + '"' + (i===0?' selected':'') + '>' + y + '</option>'; }).join('');
      seasonSectionHtml = '<section id="seasons"><div class="section-head"><h2 class="display">Season by season</h2></div>' +
        '<div style="margin-bottom:20px;"><select class="unit-select" id="season-select">' + options + '</select></div>' +
        '<div id="season-panel"></div></section>';
    }

    main.innerHTML =
      '<header class="hero">' +
        (logoHtml ? '<div class="hero-logo">' + logoHtml + '</div>' : '') +
        '<div class="hero-id">' +
          '<p class="eyebrow">' + esc(lg.acronym) + '</p>' +
          '<h1 class="display">' + esc(lg.name) + '</h1>' +
          '<div class="sub">' +
            (lg.commissioner ? '<span>Commissioner: <b>' + esc(lg.commissioner) + '</b></span>' : '') +
            (lg.years ? '<span>' + esc(lg.years) + '</span>' : '') +
            '<span>' + badge + '</span>' +
          '</div>' +
        '</div>' +
      '</header>' + hashes() +
      historyHtml +
      standingsHtml +
      seasonSectionHtml;

    var standingsYearSelect = document.getElementById('standings-year');
    if (standingsYearSelect){
      standingsYearSelect.addEventListener('change', function(){ renderStandingsYear(lg, teams, this.value); });
      renderStandingsYear(lg, teams, standingsYearSelect.value);
    }

    var seasonSelect = document.getElementById('season-select');
    if (seasonSelect){
      function renderSeason(y){
        var s = lg.seasons[y];
        var panel = document.getElementById('season-panel');
        var champHtml = s.championship
          ? '<div class="champ"><div class="label">Championship</div><div class="value">' + esc(s.championship) + '</div></div>'
          : '';
        var aboutHtml = s.about ? '<div class="about">' + esc(s.about) + '</div>' : '';
        var awardKeys = Object.keys(s.awards || {});
        var awardsHtml = awardKeys.length
          ? '<div class="award-grid">' + awardKeys.map(function(k){
              return '<div class="award-item"><div class="label">' + esc(k) + '</div><div class="value">' + esc(s.awards[k]) + '</div></div>';
            }).join('') + '</div>'
          : '<div class="no-data">No awards on file for this season.</div>';

        panel.innerHTML = '<div class="season-panel">' +
          '<div class="yr-row"><div class="yr-big display">' + y + '</div>' +
          (s.gamesPlayed ? '<div class="games mono">' + s.gamesPlayed + ' games played</div>' : '') + '</div>' +
          champHtml + aboutHtml + awardsHtml +
        '</div>';
      }
      seasonSelect.addEventListener('change', function(){ renderSeason(this.value); });
      renderSeason(seasonSelect.value);
    }
  }

  var params = new URLSearchParams(window.location.search);
  var leagueSlug = params.get('league');

  if (!leagueSlug){
    document.getElementById('main').innerHTML = '<div class="empty-state"><h1>No league specified</h1><p>Link to this page with <span class="mono">?league=league-slug</span>.</p></div>';
  } else {
    Promise.all([
      fetch('leagues.json').then(function(r){ return r.json(); }),
      fetch('teams.json').then(function(r){ return r.json(); }).catch(function(){ return []; })
    ])
      .then(function(results){
        var data = results[0], teams = results[1];
        var lg = data.find(function(l){ return l.slug === leagueSlug; });
        if (!lg){
          document.getElementById('main').innerHTML = '<div class="empty-state"><h1>League not found</h1><p>No data on file for &ldquo;' + esc(leagueSlug) + '&rdquo;.</p></div>';
          return;
        }
        render(lg, teams);
      })
      .catch(function(err){
        document.getElementById('main').innerHTML = '<div class="empty-state"><h1>Couldn\'t load league data</h1><p>' + err + '</p></div>';
      });
  }
</script>

</body>
</html>
