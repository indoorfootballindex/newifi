<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News — Indoor Football Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  :root{
    --arena-black:#111316;
    --arena-black-2:#1a1d21;
    --crimson:#D4263A;
    --amber:#E8A33D;
    --turf:#3C6E47;
    --chalk:#F2EFE6;
    --chalk-dim:#c9c6bc;
    --steel:#82868c;
    --steel-line:#2a2d31;
    --card:#1c1f23;
    --card-line:#2e3136;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--arena-black); color:var(--chalk);
    font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Anton',sans-serif; text-transform:uppercase; letter-spacing:0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit; text-decoration:none;}

  .topbar{display:flex; align-items:center; justify-content:space-between; max-width:1000px; margin:0 auto; padding:22px 24px 0;}
  .topbar .site{font-size:13px; letter-spacing:0.14em; text-transform:uppercase; color:var(--steel);}
  .topbar .site strong{color:var(--chalk); font-weight:600;}
  .topbar nav{display:flex; gap:22px; font-size:13px; letter-spacing:0.06em; text-transform:uppercase; color:var(--steel);}
  .topbar nav a:hover{color:var(--chalk);}

  main{max-width:1000px; margin:0 auto; padding:0 24px 60px;}

  .hero{padding:44px 0 26px;}
  .hero h1{font-size:clamp(34px,5.5vw,48px); margin:0 0 8px; color:var(--chalk);}
  .hero p{font-size:14px; color:var(--steel); margin:0;}

  .result-count{font-size:13px; color:var(--steel); margin-bottom:16px;}

  .news-list{display:flex; flex-direction:column; gap:14px;}
  .news-card{
    background:var(--card); border:1px solid var(--card-line); border-radius:12px; padding:22px;
    transition:border-color .15s;
  }
  .news-card:hover{border-color:var(--crimson);}
  .news-card .kicker{font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--crimson); font-weight:600; margin-bottom:8px;}
  .news-card h2{font-size:19px; margin:0 0 8px; color:var(--chalk); line-height:1.35;}
  .news-card p{font-size:14px; color:var(--chalk-dim); line-height:1.6; margin:0 0 10px;}
  .news-card .date{font-size:12px; color:var(--steel); font-family:'IBM Plex Mono',monospace;}
  .news-card.featured{border-color:rgba(232,163,61,0.35);}
  .news-card.featured h2{font-size:24px;}

  .empty{padding:60px 24px; text-align:center; color:var(--steel);}

  footer{max-width:1000px; margin:0 auto; padding:40px 24px 60px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; font-size:12px; color:var(--steel);}

  ::selection{background:var(--crimson); color:var(--chalk);}
</style>
</head>
<body>

<div class="topbar">
  <div class="site"><a href="index.html"><strong>Indoor Football Index</strong></a> / News</div>
  <nav>
    <a href="leagues.html">Leagues</a>
    <a href="teams.html">Teams</a>
    <a href="standings.html">Standings</a>
    <a href="players.html">Players</a>
    <a href="schedule.html">Schedule</a>
    <a href="scorigami.html">Scorigami</a>
    <a href="news.html">News</a>
  </nav>
</div>

<main>
  <div class="hero">
    <h1 class="display">News</h1>
    <p>The latest from around the Index.</p>
  </div>

  <div class="result-count" id="result-count">Loading&hellip;</div>
  <div class="news-list" id="news-list"></div>
  <div class="empty" id="empty-state" style="display:none;">No articles published yet.</div>
</main>

<footer>
  <span>Indoor Football Index &middot; News archive.</span>
  <span id="footer-count"></span>
</footer>

<script>
  function esc(s){
    var d = document.createElement('div');
    d.textContent = s == null ? '' : s;
    return d.innerHTML;
  }

  function excerpt(bodyHtml, len){
    if (!bodyHtml) return '';
    // strip tags to get plain text for the preview snippet — the full
    // formatted HTML is what article.html renders, this is just a teaser
    var text = bodyHtml.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    return text.length > len ? text.slice(0, len).trim() + '\u2026' : text;
  }

  function cardHtml(a){
    var cls = 'news-card' + (a.featured ? ' featured' : '');
    return '<a class="' + cls + '" href="article.html?article=' + esc(a.slug) + '">' +
      (a.kicker ? '<div class="kicker">' + esc(a.kicker) + '</div>' : '') +
      '<h2>' + esc(a.title) + '</h2>' +
      '<p>' + esc(excerpt(a.body, a.featured ? 260 : 160)) + '</p>' +
      '<div class="date">' + esc(a.date || '') + '</div>' +
    '</a>';
  }

  fetch('news.json')
    .then(function(r){ return r.json(); })
    .then(function(articles){
      var list = document.getElementById('news-list');
      var countEl = document.getElementById('result-count');
      var emptyEl = document.getElementById('empty-state');

      countEl.textContent = articles.length + (articles.length === 1 ? ' article' : ' articles');
      document.getElementById('footer-count').textContent = articles.length + ' articles';

      if (!articles.length){
        list.style.display = 'none';
        emptyEl.style.display = 'block';
        return;
      }
      list.innerHTML = articles.map(cardHtml).join('');
    })
    .catch(function(err){
      document.getElementById('result-count').textContent = '';
      document.getElementById('empty-state').style.display = 'block';
      document.getElementById('empty-state').textContent = "Couldn't load news.json: " + err;
    });
</script>

</body>
</html>
